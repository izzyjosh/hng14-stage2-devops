name: Job handling microservices CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: localhost:5000

jobs:
  #------------------------
  # Lint Job
  #------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 .

      - uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npx eslint .

      - name: Install hadolint
        run: |
          sudo wget -O /usr/local/bin/hadolint \
          https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles
        run: find . -name "Dockerfile" -exec hadolint {} \;

  #------------------------
  # Test Job
  #------------------------
  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Install API deps
        run: |
          cd api
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run tests
        run: |
          cd api
          pytest --cov=. --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: api/coverage.xml

  #------------------------
  # PIPELINE JOB (MERGED)
  #------------------------
  pipeline:
    runs-on: ubuntu-latest
    needs: test

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - uses: actions/checkout@v3

      # -----------------------
      # BUILD (using action)
      # -----------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set SHA
        run: echo "SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            localhost:5000/api:${{ env.SHA }}
            localhost:5000/api:latest

      - name: Build & push Worker
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            localhost:5000/worker:${{ env.SHA }}
            localhost:5000/worker:latest

      - name: Build & push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            localhost:5000/frontend:${{ env.SHA }}
            localhost:5000/frontend:latest

      # -----------------------
      # SECURITY SCAN
      # -----------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Scan images
        run: |
          FAILED=0

          trivy image --severity CRITICAL --exit-code 1 localhost:5000/api:${{ env.SHA }} || FAILED=1
          trivy image --severity CRITICAL --exit-code 1 localhost:5000/worker:${{ env.SHA }} || FAILED=1
          trivy image --severity CRITICAL --exit-code 1 localhost:5000/frontend:${{ env.SHA }} || FAILED=1

          exit $FAILED

      # -----------------------
      # INTEGRATION TEST
      # -----------------------
      - name: Install tools
        run: |
          sudo apt-get install -y docker-compose jq

      - name: Start stack
        run: docker-compose up -d --build

      - name: Wait for API
        run: |
          for i in {1..12}; do
            if curl -f http://localhost:8000/health; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Submit job
        run: curl -X POST http://localhost:8000/jobs

      - name: Poll result
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s http://localhost:8000/jobs | jq -r '.status')
            if [ "$STATUS" = "completed" ]; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Cleanup
        if: always()
        run: docker-compose down

      # -----------------------
      # DEPLOY (rolling)
      # -----------------------
      - name: Deploy API
        if: github.ref == 'refs/heads/main'
        run: |
          docker run -d --name api_new -p 8001:8000 localhost:5000/api:latest

          for i in {1..12}; do
            if curl -f http://localhost:8001/health; then
              docker rm -f api || true
              docker rename api_new api
              exit 0
            fi
            sleep 5
          done

          docker rm -f api_new
          exit 1

      - name: Deploy Frontend
        if: github.ref == 'refs/heads/main'
        run: |
          docker run -d --name frontend_new -p 3000:3000 localhost:5000/frontend:latest

          for i in {1..12}; do
            if curl -f http://localhost:3000; then
              docker rm -f frontend || true
              docker rename frontend_new frontend
              exit 0
            fi
            sleep 5
          done

          docker rm -f frontend_new
          exit 1

      - name: Deploy Worker
        if: github.ref == 'refs/heads/main'
        run: |
          docker run -d --name worker_new localhost:5000/worker:latest
          sleep 10

          if docker ps | grep worker_new; then
            docker rm -f worker || true
            docker rename worker_new worker
          else
            docker rm -f worker_new
            exit 1
          fi