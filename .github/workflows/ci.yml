name: Job handling microservices CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: localhost:5000

jobs:
  #------------------------
  # Lint Job
  #------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # python linting
      - name: Install flake8
        run: pip install flake8

      - name: Run flake*
        run: flake8 .

      # Js linting
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint (frontend)
        run: |
          cd frontend
          npx eslint .

      # Dockerfile linting
      - name: Install hadolint
        run: |
          sudo wget -O /usr/local/bin/hadolint \
          https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles
        run: find . -name "Dockerfile" -exec hadolint {} \;

  #------------------------
  # Test Job
  #------------------------
  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Run API tests
      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt
          pip install httpx pytest pytest-cov

      - name: Run API tests
        run: |
          cd api
          pytest --cov=. --cov-report=xml

      # Run Worker tests
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  #------------------------
  # Build Job
  #------------------------
  build:
    runs-on: ubuntu-latest
    needs: test

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and tag images
        run: |
          SHA=${{ github.sha }}

          docker build -t $REGISTRY/api:$SHA -t $REGISTRY/api:latest ./api
          docker build -t $REGISTRY/worker:$SHA -t $REGISTRY/worker:latest ./worker
          docker build -t $REGISTRY/frontend:$SHA -t $REGISTRY/frontend:latest ./frontend

      - name: Push images to registry
        run: |
          SHA=${{ github.sha }}

          docker push $REGISTRY/api:$SHA
          docker push $REGISTRY/api:latest

          docker push $REGISTRY/worker:$SHA
          docker push $REGISTRY/worker:latest

          docker push $REGISTRY/frontend:$SHA
          docker push $REGISTRY/frontend:latest

  #------------------------
  # Security Scan Job
  #------------------------
    security:
    runs-on: ubuntu-latest
    needs: build

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      # -----------------------
      # REBUILD IMAGES (CRITICAL FIX)
      # -----------------------
      - name: Build images for scan
        run: |
          docker build -t api:scan ./api
          docker build -t worker:scan ./worker
          docker build -t frontend:scan ./frontend

      # -----------------------
      # SCAN IMAGES
      # -----------------------
      - name: Scan images
        run: |
          FAILED=0

          trivy image --severity CRITICAL --exit-code 1 \
            --format sarif -o trivy-api.sarif api:scan || FAILED=1

          trivy image --severity CRITICAL --exit-code 1 \
            --format sarif -o trivy-worker.sarif worker:scan || FAILED=1

          trivy image --severity CRITICAL --exit-code 1 \
            --format sarif -o trivy-frontend.sarif frontend:scan || FAILED=1

          exit $FAILED

      - name: Upload SARIF
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-api.sarif
            trivy-worker.sarif
            trivy-frontend.sarif

  #------------------------
  # Integration Test Job
  #------------------------
  integration:
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start services with Docker Compose
        run: |
          docker-compose up -d --build

      - name: Wait for services to be healthy
        run: |
          while ! docker ps | grep "healthy"; do
            echo "Waiting for services to be healthy..."
            sleep 5
          done

      - name: Submit job
        run: |
          curl -X POST http://localhost:8000/jobs > response.json

      - name: Poll until done
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s http://localhost:8000/jobs | jq -r '.status')
            if [ "$STATUS" = "completed" ]; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose down

  #------------------------
  # Deploy Job
  #------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Pull latest images
        run: |
          docker pull localhost:5000/api:latest
          docker pull localhost:5000/frontend:latest
          docker pull localhost:5000/worker:latest

      # -----------------------
      # 1. API rolling deploy
      # -----------------------
      - name: Deploy API (rolling)
        run: |
          set -e

          OLD_CONTAINER=api_old
          NEW_CONTAINER=api_new

          # start new version
          docker run -d --name $NEW_CONTAINER -p 8001:8000 localhost:5000/api:latest

          # health check (60s max)
          for i in {1..12}; do
            if curl -f http://localhost:8001/health; then
              echo "API healthy"
              docker stop api || true
              docker rm api || true
              docker rename $NEW_CONTAINER api
              exit 0
            fi
            sleep 5
          done

          echo "API health check failed — rollback"
          docker rm -f $NEW_CONTAINER
          exit 1

      # -----------------------
      # 2. Frontend rolling deploy
      # -----------------------
      - name: Deploy Frontend (rolling)
        run: |
          set -e

          NEW_CONTAINER=frontend_new

          docker run -d --name $NEW_CONTAINER -p 3000:3000 localhost:5000/frontend:latest

          for i in {1..12}; do
            if curl -f http://localhost:3000; then
              docker stop frontend || true
              docker rm frontend || true
              docker rename $NEW_CONTAINER frontend
              exit 0
            fi
            sleep 5
          done

          docker rm -f $NEW_CONTAINER
          exit 1

      # -----------------------
      # 3. Worker rolling deploy
      # -----------------------
      - name: Deploy Worker (rolling)
        run: |
          set -e

          NEW_CONTAINER=worker_new

          docker run -d --name $NEW_CONTAINER localhost:5000/worker:latest

          # worker usually has no HTTP health endpoint
          # so we just check container is running

          sleep 10

          if docker ps | grep worker_new; then
            docker stop worker || true
            docker rm worker || true
            docker rename $NEW_CONTAINER worker
          else
            echo "Worker failed — rollback"
            docker rm -f $NEW_CONTAINER
            exit 1
          fi
