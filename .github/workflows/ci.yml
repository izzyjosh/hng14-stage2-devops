name: Job handling microservices CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ${{ secrets.REGISTRY }}

jobs:
  #------------------------
  # Lint Job
  #------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # python linting
      - name: Install flake8
        run: pip install flake8

      - name: Run flake*
        run: flake8 .

      # Js linting
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint (frontend)
        run: |
          cd frontend
          npx eslint .

      # Dockerfile linting
      - name: Install hadolint
        run: |
          sudo wget -O /usr/local/bin/hadolint \
          https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles
        run: find . -name "Dockerfile" -exec hadolint {} \;

  #------------------------
  # Test Job
  #------------------------
  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Run API tests
      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt
          pip install httpx pytest pytest-cov

      - name: Run API tests
        run: |
          cd api
          pytest --cov=. --cov-report=xml

      # Run Worker tests
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  #------------------------
  # Build Job
  #------------------------
  build:
    runs-on: ubuntu-latest
    needs: test

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and tag images
        run: |
          SHA=${{ github.sha }}
          REGISTRY_ADDR=${REGISTRY:-localhost:5000}

          docker buildx build --load \
            --cache-from type=gha,scope=api \
            --cache-to type=gha,mode=max,scope=api \
            -t $REGISTRY_ADDR/api:$SHA -t $REGISTRY_ADDR/api:latest ./api

          docker buildx build --load \
            --cache-from type=gha,scope=worker \
            --cache-to type=gha,mode=max,scope=worker \
            -t $REGISTRY_ADDR/worker:$SHA -t $REGISTRY_ADDR/worker:latest ./worker

          docker buildx build --load \
            --cache-from type=gha,scope=frontend \
            --cache-to type=gha,mode=max,scope=frontend \
            -t $REGISTRY_ADDR/frontend:$SHA -t $REGISTRY_ADDR/frontend:latest ./frontend

      - name: Push images to registry
        run: |
          SHA=${{ github.sha }}
          REGISTRY_ADDR=${REGISTRY:-localhost:5000}

          docker push $REGISTRY_ADDR/api:$SHA
          docker push $REGISTRY_ADDR/api:latest

          docker push $REGISTRY_ADDR/worker:$SHA
          docker push $REGISTRY_ADDR/worker:latest

          docker push $REGISTRY_ADDR/frontend:$SHA
          docker push $REGISTRY_ADDR/frontend:latest

  #------------------------
  # Security Scan Job
  #------------------------
  security:
    runs-on: ubuntu-latest
    needs: build

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      # -----------------------
      # REBUILD IMAGES (CRITICAL FIX)
      # -----------------------
      - name: Build images for scan
        run: |
          docker build -t api:scan ./api
          docker build -t worker:scan ./worker
          docker build -t frontend:scan ./frontend

      # -----------------------
      # SCAN IMAGES
      # -----------------------
      - name: Scan images
        run: |
          FAILED=0

          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --format sarif -o trivy-api.sarif api:scan || FAILED=1

          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --format sarif -o trivy-worker.sarif worker:scan || FAILED=1

          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --format sarif -o trivy-frontend.sarif frontend:scan || FAILED=1

          exit $FAILED

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-api.sarif
            trivy-worker.sarif
            trivy-frontend.sarif

  #------------------------
  # Integration Test Job
  #------------------------
  integration:
    runs-on: ubuntu-latest
    needs: security
    env:
      REDIS_IMAGE: redis:7
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: 8000
      API_INTERNAL_PORT: 8000
      FRONTEND_PORT: 3000
      FRONTEND_INTERNAL_PORT: 3000
      API_URL: http://api:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API readiness..."
            sleep 3
          done

          echo "API did not become ready in time"
          docker compose ps
          docker compose logs api
          exit 1

      - name: Submit job
        run: |
          curl -fsS -X POST http://localhost:8000/jobs > response.json
          cat response.json

      - name: Poll until done
        run: |
          JOB_ID=$(python3 -c "import json; print(json.load(open('response.json'))['job_id'])")
          echo "Polling job: $JOB_ID"

          for i in {1..10}; do
            STATUS=$(curl -fsS http://localhost:8000/jobs/$JOB_ID | python3 -c "import sys, json; print(json.load(sys.stdin).get('status', 'unknown'))")
            if [ "$STATUS" = "completed" ]; then
              exit 0
            fi
            echo "Current status: $STATUS"
            sleep 3
          done

          docker compose logs worker
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose down

  #------------------------
  # Deploy Job
  #------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # -----------------------
      # REBUILD IMAGES (CRITICAL FIX)
      # -----------------------
      - name: Build images for deploy
        run: |
          docker build -t api:latest ./api
          docker build -t worker:latest ./worker
          docker build -t frontend:latest ./frontend

      - name: Prepare deploy network and Redis
        run: |
          docker network create deploy_net || true
          docker rm -f deploy_redis || true
          docker run -d --name deploy_redis --network deploy_net redis:7

      # -----------------------
      # API ROLLING DEPLOY
      # -----------------------
      - name: Deploy API (rolling)
        run: |
          set -e

          docker rm -f api_new || true
          docker run -d --name api_new --network deploy_net \
            -e REDIS_HOST=deploy_redis \
            -e REDIS_PORT=6379 \
            -p 8001:8000 api:latest

          for i in {1..12}; do
            if curl -fsS http://localhost:8001/health; then
              docker rm -f api || true
              docker rename api_new api
              exit 0
            fi
            sleep 5
          done

          docker logs api_new || true
          docker rm -f api_new
          exit 1

      # -----------------------
      # FRONTEND DEPLOY
      # -----------------------
      - name: Deploy Frontend (rolling)
        run: |
          set -e

          docker rm -f frontend_new || true
          docker run -d --name frontend_new --network deploy_net \
            -e API_URL=http://api:8000 \
            -p 3000:3000 frontend:latest

          for i in {1..12}; do
            if curl -fsS http://localhost:3000/health; then
              docker rm -f frontend || true
              docker rename frontend_new frontend
              exit 0
            fi
            sleep 5
          done

          docker logs frontend_new || true
          docker rm -f frontend_new
          exit 1

      # -----------------------
      # WORKER DEPLOY
      # -----------------------
      - name: Deploy Worker
        run: |
          set -e

          docker rm -f worker_new || true
          docker run -d --name worker_new --network deploy_net \
            -e REDIS_HOST=deploy_redis \
            -e REDIS_PORT=6379 worker:latest

          sleep 10

          if docker ps | grep worker_new; then
            docker rm -f worker || true
            docker rename worker_new worker
          else
            docker logs worker_new || true
            docker rm -f worker_new
            exit 1
          fi

      - name: Deploy cleanup
        if: always()
        run: |
          docker rm -f deploy_redis || true
          docker network rm deploy_net || true