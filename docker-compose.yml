name: job-queue

services:
  # redis service
  redis:
    image: ${REDIS_IMAGE}
    container_name: redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # api service
  api:
    build: ./api
    container_name: api
    ports:
      - "${API_PORT}:${API_INTERNAL_PORT}"
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # worker service
  worker:
    build: ./worker
    container_name: worker
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # frontend service
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_INTERNAL_PORT}"
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=${API_URL}
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

networks:
  app_network:
    name: ${COMPOSE_NETWORK_NAME}
    driver: bridge
